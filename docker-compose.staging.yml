version: '3.8'

networks:
  staging_network:
    driver: bridge

services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY}:staging
    container_name: event_ticketing_api_staging
    restart: always
    ports:
      - "8080:8080"
      - "443:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Staging
      - ASPNETCORE_HTTP_PORTS=8080
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=event_ticketing_staging
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_CONNECTION=redis:6379
    networks:
      - staging_network
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: event_ticketing_db_staging
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=event_ticketing_staging
    networks:
      - staging_network
    volumes:
      - pgdata_staging:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: event_ticketing_redis_staging
    restart: always
    networks:
      - staging_network
    volumes:
      - redisdata_staging:/data

volumes:
  pgdata_staging:
  redisdata_staging:
