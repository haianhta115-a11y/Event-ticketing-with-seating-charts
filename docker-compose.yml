services:
  db:
    image: postgres:15-alpine
    container_name: event_ticketing_db
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER for the local database}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for the local database}
      POSTGRES_DB: event_ticketing
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: event_ticketing_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
