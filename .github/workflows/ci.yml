name: CI

on:
  push:
    # Every push, including feature branches; no deployment secrets.
  pull_request:
    branches: [main, develop, staging]
  workflow_dispatch:
    inputs:
      coverage_base_sha:
        description: 'Approved earlier 40-character baseline SHA for coverage comparison'
        type: string
        required: true
  workflow_call:
    inputs:
      coverage_base_sha:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend build, format and isolated tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: event_ticketing_test_ci_bootstrap
          # ONLY this disposable, loopback-published CI service; no shared credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --shm-size=512m
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d event_ticketing_test_ci_bootstrap"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['127.0.0.1:6379:6379']
        options: >-
          --health-cmd "redis-cli -n 15 ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BATCH1A1_POSTGRES: Host=127.0.0.1;Port=5432;Database=event_ticketing_test_ci_config;Username=postgres;Include Error Detail=false
      BATCH1A1_REDIS: 127.0.0.1:6379,defaultDatabase=15,abortConnect=true
      CI_BUILD_CONFIGURATION: Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore build and safety-check dependencies
        run: |
          dotnet restore EventTicketing.slnx
          dotnet restore tests/EnvironmentSafetyChecks/EnvironmentSafetyChecks.csproj
      - name: Backend build
        run: dotnet build EventTicketing.slnx -c Release --no-restore
      - name: Backend format
        run: dotnet format EventTicketing.slnx --verify-no-changes --no-restore
      - name: Environment safety
        run: dotnet run --project tests/EnvironmentSafetyChecks -c Release --no-restore
      - name: Install isolated browser test runtime
        run: |
          npm ci --prefix frontend --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/browser-runtime" --ignore-scripts --no-package-lock playwright@1.62.1
          "$RUNNER_TEMP/browser-runtime/node_modules/.bin/playwright" install --with-deps chrome
          printf 'FIX03_PLAYWRIGHT=%s\n' "$RUNNER_TEMP/browser-runtime/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Full backend, real browsers and local latency (fail on missing or skipped tests)
        # Independently created disposable CI service; no shared endpoint or credentials.
        # The initializer compares this non-secret cluster identifier before CREATE.
        env:
          LOCAL_SETUP_POSTGRES_PORT: '5432'
        run: |
          cluster_id=$(docker exec '${{ job.services.postgres.id }}' psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -At -c 'SELECT system_identifier FROM pg_control_system()')
          [[ "$cluster_id" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
          export LOCAL_SETUP_POSTGRES_SYSTEM_IDENTIFIER="$cluster_id"
          node tests/ci/run-backend-tests.mjs

  frontend:
    name: Frontend and workflow quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          npm ci --prefix frontend --ignore-scripts
          npm ci --prefix tests/ci --ignore-scripts
      - name: YAML, dependencies and failure-propagation regression checks
        run: |
          npm run check --prefix tests/ci
          npm test --prefix tests/ci
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Full frontend tests
        working-directory: frontend
        run: node --test tests/*.test.mjs
      - name: Changed executable JS coverage non-regression
        env:
          COVERAGE_BASE_SHA: ${{ inputs.coverage_base_sha || github.event.pull_request.base.sha || github.event.before }}
          COVERAGE_INITIAL_BASE_SHA: ${{ vars.COVERAGE_INITIAL_BASE_SHA }}
        run: node tests/ci/run-frontend-coverage.mjs
      - name: Frontend production build
        working-directory: frontend
        run: npm run build

  frontend-lint:
    name: Frontend lint (parallel with tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Locked dependencies and lint
        run: |
          npm ci --prefix frontend --ignore-scripts
          npm run lint --prefix frontend

  quality-gate:
    name: Required quality gate
    needs: [backend, frontend, frontend-lint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require every job to succeed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          LINT_RESULT: ${{ needs.frontend-lint.result }}
        run: node tests/ci/quality-gate.mjs


