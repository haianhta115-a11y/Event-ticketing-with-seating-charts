name: Delivery artifacts (code-only)

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      publish_image:
        description: 'Explicitly publish verified API image to GHCR; does NOT deploy staging or databases'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: delivery-artifacts-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  candidate:
    name: Package only after all checks pass
    needs: [quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Package same-commit backend and frontend
        run: |
          dotnet publish EventTicketing.Api/EventTicketing.Api.csproj -c Release -o artifacts/api
          npm ci --prefix frontend --ignore-scripts
          npm run build --prefix frontend
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: code-only-${{ github.sha }}
          path: |
            artifacts/api
            frontend/dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Opt-in verified API image (no staging transport)
    needs: [quality, candidate]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_image == true && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build verified API image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker build --tag "$image" .
          printf 'DELIVERY_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
      - name: Authenticate registry with existing built-in workflow token
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish exact verified SHA tag
        run: docker push "$DELIVERY_IMAGE"

# No host, deployment transport, environment, credential or health URL is assumed.
# Staging deployment/Home HTTP200/rollback require separate approved verification.
